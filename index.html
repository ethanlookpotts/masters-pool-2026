<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Masters Pool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>2026 Masters Pool</h1>
            <div class="status-row">
                <span class="tournament-status" id="tournament-status"></span>
                <span class="cut-line-display" id="cut-line-display"></span>
            </div>
            <div class="header-controls">
                <button id="refresh-btn" class="ctrl-btn primary">Refresh</button>
                <button id="field-rankings-btn" class="ctrl-btn">Field</button>
                <button id="scenarios-btn" class="ctrl-btn">Scenarios</button>
                <button id="help-btn" class="ctrl-btn icon" aria-label="How this pool works">?</button>
            </div>
            <div id="last-updated" class="last-updated">Updating...</div>
        </div>
    </header>

    <main class="container">
        <section id="leaderboard-section">
            <div id="pool-leaderboard" class="vertical-stack">
                <div class="loading">Loading live scores...</div>
            </div>
        </section>
    </main>

    <!-- Scenarios Modal -->
    <div id="scenarios-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sunday Scenarios</h2>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <div class="modal-body" id="scenarios-modal-body">
                <!-- Scenarios content injected here -->
            </div>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>How This Works</h2>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <div class="modal-body" id="help-modal-body">
                <!-- Help content injected here -->
            </div>
        </div>
    </div>

    <!-- Full Field Modal -->
    <div id="field-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Field Rankings</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="field-rankings-list">
                <!-- Field rankings will be injected here -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Data provided by ESPN • Winner Take All Pool</p>
        </div>
    </footer>

    <script src="app.js?v=5"></script>
</body>
</html>
