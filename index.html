<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Masters Pool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>2026 Masters Pool</h1>
            <div class="cut-line-display" id="cut-line-display">
                <!-- Cut line will be injected here -->
            </div>
            <div class="refresh-controls">
                <button id="refresh-btn">Refresh Leaderboard</button>
                <button id="field-rankings-btn">Full Field Rankings</button>
                <div id="last-updated" class="last-updated">Updating...</div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="leaderboard-section">
            <div id="pool-leaderboard" class="vertical-stack">
                <div class="loading">Loading live scores...</div>
            </div>
        </section>
    </main>

    <!-- Full Field Modal -->
    <div id="field-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Field Rankings</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="field-rankings-list">
                <!-- Field rankings will be injected here -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Data provided by ESPN • Winner Take All Pool</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
